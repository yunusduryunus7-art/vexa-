<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">

<style>

.sv.add{color:var(--gr)}
.side{width:250px;background:var(--p1);display:flex;flex-direction:column;flex:none}
.sh{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #0003;width:100%;text-align:left}
.list{flex:1;overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.06em;padding:14px 8px 4px}
.cat button{color:var(--mu);font-size:18px;line-height:1}
.it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--mu);width:100%;text-align:left}
.it:hover{background:var(--p2);color:var(--tx)}.it.on{background:var(--p3);color:#fff}
.r2{display:flex;align-items:center}.r2 .x{color:var(--mu);padding:4px 8px}
.me{background:#12132a;padding:8px;display:flex;align-items:center;gap:8px}
.me .n{flex:1;min-width:0}.me b,.me small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu);font-size:12px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}.ib:hover{background:var(--p3)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--p2)}
.mh{height:52px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;border-bottom:1px solid #0003;flex:none}
#msgs{flex:1;overflow-y:auto;padding:16px 18px}
.m{display:flex;gap:12px;padding:6px 0}.m b{margin-right:8px}.m small{color:var(--mu);font-size:12px}.m p{white-space:pre-wrap;word-break:break-word}
.in{display:flex;gap:8px;padding:0 16px 16px}.in input{flex:1;background:var(--p3);border:0;padding:13px 16px;border-radius:12px}.in .btn{padding:0 18px;border-radius:12px}
.mem{width:220px;background:var(--p1);padding:12px;overflow-y:auto;flex:none}
.empty{margin:auto;text-align:center;color:var(--mu);padding:24px}
.empty h2{color:var(--tx);margin-bottom:6px;font-size:24px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:40;padding:16px}
.md{background:var(--p1);border-radius:16px;padding:22px;width:min(420px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.md h3{font-size:20px}.md label{font-size:12px;color:var(--mu);font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.auth{margin:auto;width:min(400px,92%);background:var(--p1);padding:28px;border-radius:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0008}
.logo{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px}.tabs button{flex:1;padding:8px;border-radius:8px;color:var(--mu)}.tabs .on{background:var(--p3);color:#fff}
.err{color:var(--rd);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--p1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hb{display:none;width:36px;height:36px;border-radius:8px;place-items:center;font-size:18px}
@media(max-width:900px){.mem{display:none}}
@media(max-width:700px){.hb{display:grid}.rail,.side{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:20;transform:translateX(-130%);transition:transform .2s}.rail{left:0}.side{left:72px;width:min(250px,calc(100vw - 90px))}#app.nav .rail,#app.nav .side{transform:none;box-shadow:8px 0 30px #0008}}
@keyframes g-bounce{50%{transform:translateY(-16px)}}@keyframes g-pulse{50%{transform:scale(1.3)}}@keyframes g-shake{25%{transform:translateX(-8px) rotate(-8deg)}75%{transform:translateX(8px) rotate(8deg)}}@keyframes g-spin{to{transform:rotate(360deg)}}@keyframes g-wave{50%{transform:rotate(28deg)}}@keyframes g-float{50%{transform:translateY(-10px) scale(.9);opacity:.7}}@keyframes g-flick{50%{transform:scale(1.15) rotate(5deg)}}@keyframes g-pop{50%{transform:scale(1.4)}}@keyframes g-swing{25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
.ga{width:150px;height:110px;border-radius:14px;display:grid;place-items:center;font-size:52px;position:relative;overflow:hidden;margin-top:4px}.ga small{position:absolute;bottom:6px;font-size:11px;font-weight:700;color:#fff}.gp .ga{width:100%;height:84px;font-size:38px;margin:0}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.vgrid{flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:24px;align-content:flex-start;overflow-y:auto}.vc{width:170px;height:130px;background:var(--p1);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px solid transparent;transition:.15s}.vc.sp{border-color:var(--gr);box-shadow:0 0 18px #34d39966}.vbar{padding:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sv{position:relative}.bdg{position:absolute;right:-4px;bottom:-4px;background:var(--rd);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid #0a0b18}
.mn{background:#7c5cff33;color:#c4b5ff;border-radius:5px;padding:0 3px;font-weight:600}.mn.me{background:#f59e0b33;color:#fcd34d}.m.hl{background:#f59e0b14;box-shadow:inset 3px 0 #f59e0b;padding-left:8px;border-radius:6px}
.cat button{padding:6px 12px;margin:-6px -6px}
html,body{position:fixed;top:0;left:0;right:0;width:100%;overflow:hidden}
.m{position:relative;border-radius:8px;padding:6px 40px 6px 8px}.m:hover{background:#ffffff08}.m>div:nth-child(2){flex:1;min-width:0}
.mm{position:absolute;right:4px;top:4px;width:30px;height:28px;border-radius:8px;background:var(--p1);opacity:0;font-weight:700}.m:hover .mm,.mm:focus{opacity:1}@media(hover:none){.mm{opacity:.85}}
.gt{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.gt button{white-space:nowrap;padding:5px 12px;font-size:13px}.gres{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:45vh;overflow-y:auto}.gres img{width:100%;height:90px;object-fit:cover;border-radius:10px;display:block;background:var(--p3)}.gres .ga{width:100%;height:90px;font-size:34px;margin:0}
.chk input[type=radio],.chk input[type=checkbox]{padding:0}

<script>
/* >>> BURAYI DOLDUR: Supabase > Project Settings > API <<< */
const SUPABASE_URL='https://awenfsewnqbqahqrosxr.supabase.co', SUPABASE_KEY='sb_publishable_QEwlrnGC4m82RzVbe4zxug_Wowh_a2I';
const GIPHY_KEY=onst GIPHY_KEY='FqweOOjNTlDdVBRupnq67QtXSPKU72Tv'; /* developers.giphy.com > Create an API Key */*/
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['#7c5cff','#22d3ee','#f472b6','#f59e0b','#34d399','#fb7185','#60a5fa','#a78bfa'];
let me=null,P={},SV=[],MB=[],CH=[],MS=[],subbed=false,rt,FR=[],RL=[],MR=[],DMP=[],CAT=[];
let S={view:'home',sid:null,cid:null,dm:null,modal:null,tab:'login',err:'',q:'',nav:false};

const dk=(a,b)=>[a,b].sort().join('_');
const U=id=>P[id]||{name:'?',color:'#666',username:'?'};
const av=(u,z=38)=>`<div class="av" style="width:${z}px;height:${z}px;background:${u.img?`url(${esc(u.img)}) center/cover`:(u.color||'#666')};font-size:${z*.48}px">${u.img?'':esc(u.emoji||(u.name||'?')[0].toUpperCase())}</div>`;

/* ---------- Veri: Supabase'den çek ---------- */
async function load(){
  const [a,b,c,d]=await Promise.all([sb.from('profiles').select('*'),sb.from('servers').select('*').order('created_at'),sb.from('members').select('*'),sb.from('channels').select('*').order('name')]);
  P={};(a.data||[]).forEach(p=>P[p.id]=p);SV=b.data||[];MB=c.data||[];CH=d.data||[];
  const [e,f,g,k]=await Promise.all([sb.from('friendships').select('*'),sb.from('roles').select('*'),sb.from('member_roles').select('*'),sb.from('categories').select('*')]);FR=e.data||[];RL=f.data||[];MR=g.data||[];CAT=k.data||[];
  const dm=await sb.from('messages').select('dm_key').not('dm_key','is',null).limit(1000);DMP=[...new Set((dm.data||[]).flatMap(r=>r.dm_key.split('_')).filter(x=>x!==me))];
  const mq2=await sb.from('messages').select('id,channel_id,created_at,user_id').not('channel_id','is',null).or(`body.ilike.*<@${me}>*,body.ilike.*@everyone*`).order('created_at',{ascending:false}).limit(300);MROWS=mq2.data||[];MLOADED=true;
  await loadMsgs();
}
async function loadMsgs(){
  let q=sb.from('messages').select('*').order('created_at').limit(200);
  if(S.view==='server'&&chan()?.type==='text')q=q.eq('channel_id',S.cid);
  else if(S.view==='home'&&S.dm)q=q.eq('dm_key',dk(me,S.dm));
  else{MS=[];return}
  MS=(await q).data||[];
}
const refresh=async()=>{await load();soft()};
function subscribe(){
  if(subbed)return;subbed=true;
  sb.channel('nvx').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!S.modal)refresh()},150)}).subscribe();
}

/* ---------- Arayüz ---------- */
function authHTML(){const r=S.tab==='register';return`<form class="auth" data-f="auth"><div class="logo">Nuvexa</div>
<div class="tabs"><button type="button" data-a="tab" data-i="login" class="${r?'':'on'}">Giriş Yap</button><button type="button" data-a="tab" data-i="register" class="${r?'on':''}">Hesap Oluştur</button></div>
${r?inp('name','TAKMA AD','','text','maxlength=24'):''}${inp('username','KULLANICI ADI','','text','required autocapitalize=off')}${inp('pass','ŞİFRE','','password','required minlength=6')}
<div class="err">${esc(S.err)}</div><button class="btn">${r?'Hesabı Oluştur':'Giriş Yap'}</button></form>`}

function sideHTML(){let h='';const u=U(me);
if(S.view!=='server'){
  h=`<div class="sh">Direkt Mesajlar</div><div class="list"><div class="cat">KULLANICILAR</div>`+dmUsers().map(x=>`<button class="it ${S.dm===x.id?'on':''}" data-a="dm" data-i="${x.id}">${av(x,30)}<span>${esc(x.name)}</span></button>`).join('')+(dmUsers().length?'':'<div class="empty" style="font-size:13px">Arkadaşların ve mesajlaştığın kişiler burada görünür.</div>')+`</div>`;
}else{
  const s=srv(),own=s.owner===me,ln=(c,ic)=>`<div class="r2"><button class="it ${S.cid===c.id?'on':''}" data-a="ch" data-i="${c.id}">${ic} ${esc(c.name)}${MC[c.id]?`<b class="bdg" style="position:static;margin-left:auto">${MC[c.id]}</b>`:''}</button>${own?`<button class="x" data-a="delCh" data-i="${c.id}">✕</button>`:''}</div>`;
  const cs=CH.filter(c=>c.server_id===s.id);
  h=`<button class="sh" data-a="srvMenu"><span>${esc(s.name)}</span><span>⌄</span></button><div class="list">${chList(s,own)}</div>`;
}
return`<div class="side">${h}<div class="me"><button style="display:flex;gap:8px;align-items:center;flex:1;min-width:0;text-align:left" data-a="settings">${av(u,34)}<div class="n"><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></button><button class="ib" data-a="settings">⚙</button></div></div>`}

function msgsHTML(){return MS.map(m=>{const u=U(m.user_id),s=S.view==='server'?srv():null,nm=s?nick(s.id,m.user_id):u.name;
return`<div class="m">${av(u,40)}<div><b>${esc(nm)}</b><small>${time(m.created_at)}</small><p>${esc(m.body)}</p></div></div>`}).join('')}

function mainHTML(){
const hb='<button class="hb" data-a="nav">☰</button>';
if(S.view==='disc'){const q=S.q.toLowerCase(),L=SV.filter(s=>!q||s.name.toLowerCase().includes(q)).map(s=>({s,n:MB.filter(m=>m.server_id===s.id).length})).sort((a,b)=>b.n-a.n);
return`<div class="main"><div class="mh">${hb}🧭 Keşfet</div><div class="list" style="padding:18px"><h2 style="font-size:24px">Sunucuları keşfet</h2><small style="color:var(--mu)">Herkesin açtığı tüm sunucular · ${L.length} sunucu</small><input id="dq" placeholder="Sunucu ara…" value="${esc(S.q)}" style="margin:14px 0"><div class="grid">`+L.map(({s,n})=>{const j=isMem(s.id);return`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="sv" ${s.img?`style="background:url(${esc(s.img)}) center/cover"`:''}>${s.img?'':esc(s.icon||s.name[0].toUpperCase())}</div><div><b>${esc(s.name)}</b><br><small style="color:var(--mu)">👑 ${esc(U(s.owner).name)} · 👥 ${n}</small></div></div><button class="btn ${j?'g':''}" data-a="${j?'srv':'jsrv'}" data-i="${s.id}">${j?'Sunucuyu Aç':'Katıl'}</button></div>`}).join('')+`</div>${L.length?'':'<div class="empty">Sunucu bulunamadı.</div>'}</div></div>`}
if(S.view==='home'){
  if(!S.dm)return`<div class="main"><div class="mh">${hb}</div><div class="empty"><div class="logo" style="font-size:44px">Nuvexa</div><h2>Hoş geldin, ${esc(U(me).name)}!</h2><p>Soldan biriyle yazış, 🧭 ile sunucu keşfet ya da + ile kendi sunucunu aç.</p></div></div>`;
  const u=U(S.dm);return`<div class="main"><div class="mh">${hb}${av(u,28)} ${esc(u.name)} <small style="color:var(--mu);font-weight:400">@${esc(u.username)}</small></div><div id="msgs">${msgsHTML()||`<div class="empty"><h2>${esc(u.name)}</h2>ile sohbetin başlangıcı.</div>`}</div><form class="in" data-f="send"><button type="button" class="btn g" data-a="attach" title="Fotoğraf / video ekle" style="padding:0 16px;font-size:20px">+</button><input name="x" autocomplete=off placeholder="${esc(u.name)} kişisine mesaj gönder"><button type="button" class="btn g" data-a="gif0">GIF</button><button class="btn">Gönder</button></form></div>`}
const c=chan();
if(!c)return`<div class="main"><div class="mh">${hb}</div><div class="empty">Kanal yok.</div></div>`;
if(c.type==='voice')return`<div class="main"><div class="mh">${hb}🔊 ${esc(c.name)}</div><div class="empty"><h2>Sesli sohbet yakında</h2>Gerçek sesli konuşma için WebRTC altyapısı (ör. LiveKit) eklenmesi gerekiyor.</div></div>`;
return`<div class="main"><div class="mh">${hb}# ${esc(c.name)}</div><div id="msgs">${msgsHTML()||`<div class="empty"><h2>#${esc(c.name)} kanalına hoş geldin</h2>İlk mesajı sen yaz.</div>`}</div><form class="in" data-f="send"><button type="button" class="btn g" data-a="attach" title="Fotoğraf / video ekle" style="padding:0 16px;font-size:20px">+</button><input name="x" autocomplete=off placeholder="#${esc(c.name)} kanalına mesaj gönder"><button type="button" class="btn g" data-a="gif0">GIF</button><button class="btn">Gönder</button></form></div>`}

function memHTML(){if(S.view!=='server')return'';const s=srv(),L=MB.filter(m=>m.server_id===s.id);
return`<div class="mem"><div class="cat">ÜYELER — ${L.length}</div>`+L.map(m=>`<div class="it" style="color:var(--tx);cursor:default">${av(U(m.user_id),28)}<span>${esc(nick(s.id,m.user_id))}${s.owner===m.user_id?' 👑':''}</span></div>`).join('')+`</div>`}

function render(){const r=$('#app'),old=$('.in input')?.value||'',oldF=document.activeElement?.name==='x';
if(!me){r.innerHTML=authHTML();return}
if(!P[me]){r.innerHTML='<div class="empty">Yükleniyor…</div>';return}
if(S.view==='server'&&(!srv()||!isMem(S.sid))){S.view='home';S.sid=null}
r.className=S.nav?'nav':'';
r.innerHTML=`<div class="rail"><button class="sv ${S.view==='home'?'on':''}" data-a="home" style="background:linear-gradient(135deg,var(--ac),var(--ac2))">N</button><button class="sv ${S.view==='disc'?'on':''}" data-a="disc">🧭</button>`+mySv().map(s=>`<button class="sv ${S.sid===s.id&&S.view==='server'?'on':''}" data-a="srv" data-i="${s.id}" title="${esc(s.name)}" ${s.img?`style="background:url(${esc(s.img)}) center/cover"`:''}>${s.img?'':esc(s.icon||s.name[0].toUpperCase())}${bdg(srvCount(s.id))}</button>`).join('')+`<button class="sv add" data-a="addSrv">+</button></div>${sideHTML()}${mainHTML()}${memHTML()}`+(S.modal?`<div class="ov" data-a="close"><form class="md" data-f="modal"><h3>${esc(S.modal.t)}</h3>${S.modal.b}<div class="row"><button type="button" class="btn g" data-a="close">${S.modal.ok?'İptal':'Kapat'}</button>${S.modal.ok?`<button class="btn">${S.modal.ok}</button>`:''}</div></form></div>`:'');

const modal=(t,b,ok,fn)=>{S.modal={t,b,ok,fn};S.nav=false;render()};

/* ---------- İşlemler ---------- */
const A={
tab(i){S.tab=i;S.err='';render()},
close,
nav(){S.nav=!S.nav;render()},
home(){S.view='home';S.sid=null;go()},
disc(){S.view='disc';S.sid=null;S.q='';S.nav=false;render()},
dm(i){S.view='home';S.dm=i;go()},
srv(i){S.view='server';S.sid=i;S.cid=(CH.find(c=>c.server_id===i&&c.type==='text')||CH.find(c=>c.server_id===i))?.id;go()},
ch(i){S.cid=i;go()},
async jsrv(i){const {error}=await sb.from('members').insert({server_id:i,user_id:me});if(error)return alert(error.message);await load();A.srv(i)},
addSrv(){modal('Sunucu Oluştur',inp('name','SUNUCU ADI',U(me).name+' sunucusu','text','required maxlength=30')+inp('icon','SİMGE (emoji, isteğe bağlı)','','text','maxlength=2'),'Oluştur',async d=>{
  const {data:s,error}=await sb.from('servers').insert({name:d.get('name'),icon:d.get('icon'),owner:me}).select().single();if(error)return alert(error.message);

let room=null,VP=[],spk=new Set(),vcid=null,vmute=false,vdeaf=false,wasM=false,vErr='';

function vUpd(){if(!room)return;VP=[room.localParticipant,...room.remoteParticipants.values()];if(inVoice())render()}
function vClean(){document.querySelectorAll('audio[data-pid]').forEach(e=>e.remove());room=null;VP=[];spk=new Set();vcid=null;vmute=false;vdeaf=false}

async function vJoin(){
  if(room)await vLeave();vErr='';
  try{
    const {data,error}=await sb.functions.invoke('lk-token',{body:{channel_id:S.cid}});
    if(error||!data?.token)throw new Error(error?.message||'Token alınamadı (lk-token fonksiyonu kurulu mu?)');
    const L=LivekitClient,r=new L.Room({adaptiveStream:true});room=r;
    r.on(L.RoomEvent.TrackSubscribed,(t,pub,p)=>{if(t.kind==='audio'){const el=t.attach();el.dataset.pid=p.identity;el.muted=vdeaf;document.body.appendChild(el)}});
    r.on(L.RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));
    [L.RoomEvent.ParticipantConnected,L.RoomEvent.ParticipantDisconnected,L.RoomEvent.TrackMuted,L.RoomEvent.TrackUnmuted].forEach(ev=>r.on(ev,vUpd));
    r.on(L.RoomEvent.ActiveSpeakersChanged,s=>{spk=new Set(s.map(x=>x.identity));vUpd()});
    r.on(L.RoomEvent.Disconnected,()=>{vClean();render()});

    try{await r.localParticipant.setMicrophoneEnabled(true)}catch(e){vmute=true;vErr='Mikrofon izni verilmedi, sadece dinleyerek bağlandın.'}
    vUpd();render();
  }catch(e){vErr='Bağlanılamadı: '+(e.message||e);if(room){try{room.disconnect()}catch(_){}}vClean();render()}

  return`<div class="cat"><span>KANALLAR</span>${own?'<button data-a="addMenu">+</button>':''}</div>`+cs.filter(c=>!cats.some(k=>k.id===c.category_id)).map(ln).join('')+cats.map(k=>`<div class="cat"><span>${esc(k.name.toUpperCase())}</span>${own?`<span><button data-a="addCh" data-i="${k.id}">+</button><button data-a="editCat" data-i="${k.id}">✏️</button></span>`:''}</div>`+cs.filter(c=>c.category_id===k.id).map(ln).join('')).join('')}
const catSel=(sid,cur)=>`<div><label>KATEGORİ</label><select name="cat"><option value="">Kategorisiz</option>${CAT.filter(k=>k.server_id===sid).map(k=>`<option value="${k.id}" ${k.id===cur?'selected':''}>${esc(k.name)}</option>`).join('')}</select></div>`;
A.addMenu=()=>modal('Oluştur',`<button type="button" class="it" data-a="addCh" data-i="">＃ Kanal oluştur</button><button type="button" class="it" data-a="addCat">📁 Kategori oluştur</button>`);
A.addCh=cid=>{const s=srv();if(!s)return;modal('Kanal Oluştur',`<div><label>KANAL TÜRÜ</label><label class="chk"><input type="radio" name="t" value="text" checked># Metin: mesaj, GIF, fotoğraf, video</label><label class="chk"><input type="radio" name="t" value="voice">🔊 Ses: sesli konuşma</label></div>`+inp('name','KANAL ADI','','text','required maxlength=24')+catSel(s.id,cid),'Oluştur',async d=>{
  const {data:c,error}=await sb.from('channels').insert({server_id:s.id,name:d.get('name').trim(),type:d.get('t'),category_id:d.get('cat')||null}).select().single();if(error)return alert(error.message);
  S.cid=c.id;S.modal=null;await load();render()})};
A.editCh=i=>{rmPop();const c=CH.find(x=>x.id===i);if(!c)return;modal('Kanalı Düzenle',inp('name','KANAL ADI',c.name,'text','required maxlength=24')+catSel(c.server_id,c.category_id)+`<button type="button" class="btn r" data-a="delCh" data-i="${i}">Kanalı Sil</button>`,'Kaydet',async d=>{
  const {error}=await sb.from('channels').update({name:d.get('name').trim(),category_id:d.get('cat')||null}).eq('id',i);if(error)return alert(error.message);S.modal=null;await load();render()})};
A.addCat=()=>modal('Kategori Oluştur',inp('name','KATEGORİ ADI','','text','required maxlength=24')+'<small style="color:var(--mu)">Kanalları gruplayan başlık. Örn: Oyunlar, Sohbet, Duyurular</small>','Oluştur',async d=>{
  const {error}=await sb.from('categories').insert({server_id:S.sid,name:d.get('name').trim()});if(error)return alert(error.message);S.modal=null;await load();render()});
A.editCat=i=>{const k=CAT.find(x=>x.id===i);if(!k)return;modal('Kategoriyi Düzenle',inp('name','KATEGORİ ADI',k.name,'text','required maxlength=24')+`<small style="color:var(--mu)">Silersen içindeki kanallar silinmez, kategorisiz kalır.</small><button type="button" class="btn r" data-a="delCat" data-i="${i}">Kategoriyi Sil</button>`,'Kaydet',async d=>{
  await sb.from('categories').update({name:d.get('name').trim()}).eq('id',i);S.modal=null;await load();render()})};
A.delCat=async i=>{if(!confirm('Kategori silinsin mi? İçindeki kanallar silinmez.'))return;await sb.from('categories').delete().eq('id',i);S.modal=null;await load();render()};

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user.id;await load();if(!P[me]){await sb.auth.signOut();me=null}else subscribe()}
  render();
})();
</script></body></html>
