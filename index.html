<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvexa</title>
<style>
:root{color-scheme:dark;--bg:#0f1020;--p1:#171830;--p2:#1e2040;--p3:#2a2d55;--tx:#e8e9ff;--mu:#9a9dc9;--ac:#7c5cff;--ac2:#22d3ee;--rd:#ff5d73;--gr:#34d399}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{height:100%;display:flex;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select{background:var(--bg);border:1px solid var(--p3);border-radius:10px;padding:10px 12px;width:100%;outline:0;font-size:16px}
input:focus{border-color:var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),#5b8cff);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.g{background:var(--p3)}.btn.r{background:var(--rd)}
.rail{width:72px;background:#0a0b18;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;flex:none}
.sv{width:48px;height:48px;border-radius:24px;background:var(--p2);display:grid;place-items:center;font-size:20px;font-weight:700;transition:.2s;flex:none}
.sv:hover,.sv.on{border-radius:16px;background:var(--ac)}
.sv.add{color:var(--gr)}
.side{width:250px;background:var(--p1);display:flex;flex-direction:column;flex:none}
.sh{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #0003;width:100%;text-align:left}
.list{flex:1;overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.06em;padding:14px 8px 4px}
.cat button{color:var(--mu);font-size:18px;line-height:1}
.it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--mu);width:100%;text-align:left}
.it:hover{background:var(--p2);color:var(--tx)}.it.on{background:var(--p3);color:#fff}
.r2{display:flex;align-items:center}.r2 .x{color:var(--mu);padding:4px 8px}
.me{background:#12132a;padding:8px;display:flex;align-items:center;gap:8px}
.me .n{flex:1;min-width:0}.me b,.me small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu);font-size:12px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}.ib:hover{background:var(--p3)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--p2)}
.mh{height:52px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;border-bottom:1px solid #0003;flex:none}
#msgs{flex:1;overflow-y:auto;padding:16px 18px}
.m{display:flex;gap:12px;padding:6px 0}.m b{margin-right:8px}.m small{color:var(--mu);font-size:12px}.m p{white-space:pre-wrap;word-break:break-word}
.in{display:flex;gap:8px;padding:0 16px 16px}.in input{flex:1;background:var(--p3);border:0;padding:13px 16px;border-radius:12px}.in .btn{padding:0 18px;border-radius:12px}
.mem{width:220px;background:var(--p1);padding:12px;overflow-y:auto;flex:none}
.empty{margin:auto;text-align:center;color:var(--mu);padding:24px}
.empty h2{color:var(--tx);margin-bottom:6px;font-size:24px}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:16px}
.md{background:var(--p1);border-radius:16px;padding:22px;width:min(420px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.md h3{font-size:20px}.md label{font-size:12px;color:var(--mu);font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.auth{margin:auto;width:min(400px,92%);background:var(--p1);padding:28px;border-radius:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0008}
.logo{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px}.tabs button{flex:1;padding:8px;border-radius:8px;color:var(--mu)}.tabs .on{background:var(--p3);color:#fff}
.err{color:var(--rd);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--p1);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hb{display:none;width:36px;height:36px;border-radius:8px;place-items:center;font-size:18px}
@media(max-width:900px){.mem{display:none}}
@media(max-width:700px){.hb{display:grid}.rail,.side{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:20;transform:translateX(-130%);transition:transform .2s}.rail{left:0}.side{left:72px;width:min(250px,calc(100vw - 90px))}#app.nav .rail,#app.nav .side{transform:none;box-shadow:8px 0 30px #0008}}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* >>> BURAYI DOLDUR: Supabase > Project Settings > API <<< */
const SUPABASE_URL='https://awenfsewnqbqahqrosxr.supabase.co', SUPABASE_KEY='sb_publishable_QEwlrnGC4m82RzVbe4zxug_Wowh_a2I';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLS=['#7c5cff','#22d3ee','#f472b6','#f59e0b','#34d399','#fb7185','#60a5fa','#a78bfa'];
let me=null,P={},SV=[],MB=[],CH=[],MS=[],subbed=false,rt;
let S={view:'home',sid:null,cid:null,dm:null,modal:null,tab:'login',err:'',q:'',nav:false};

const dk=(a,b)=>[a,b].sort().join('_');
const U=id=>P[id]||{name:'?',color:'#666',username:'?'};
const av=(u,z=38)=>`<div class="av" style="width:${z}px;height:${z}px;background:${u.color||'#666'};font-size:${z*.48}px">${esc(u.emoji||(u.name||'?')[0].toUpperCase())}</div>`;
const isMem=(sid,u=me)=>MB.some(m=>m.server_id===sid&&m.user_id===u);
const mySv=()=>SV.filter(s=>isMem(s.id));
const srv=()=>SV.find(s=>s.id===S.sid),chan=()=>CH.find(c=>c.id===S.cid);
const nick=(sid,u)=>MB.find(m=>m.server_id===sid&&m.user_id===u)?.nick||U(u).name;
const time=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const inp=(k,l,v='',t='text',x='')=>`<div><label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}" ${x}></div>`;

/* ---------- Veri: Supabase'den çek ---------- */
async function load(){
  const [a,b,c,d]=await Promise.all([sb.from('profiles').select('*'),sb.from('servers').select('*').order('created_at'),sb.from('members').select('*'),sb.from('channels').select('*').order('name')]);
  P={};(a.data||[]).forEach(p=>P[p.id]=p);SV=b.data||[];MB=c.data||[];CH=d.data||[];
  await loadMsgs();
}
async function loadMsgs(){
  let q=sb.from('messages').select('*').order('created_at').limit(200);
  if(S.view==='server'&&chan()?.type==='text')q=q.eq('channel_id',S.cid);
  else if(S.view==='home'&&S.dm)q=q.eq('dm_key',dk(me,S.dm));
  else{MS=[];return}
  MS=(await q).data||[];
}
const refresh=async()=>{await load();render()};
function subscribe(){
  if(subbed)return;subbed=true;
  sb.channel('nvx').on('postgres_changes',{event:'*',schema:'public'},()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!S.modal)refresh()},150)}).subscribe();
}

/* ---------- Arayüz ---------- */
function authHTML(){const r=S.tab==='register';return`<form class="auth" data-f="auth"><div class="logo">Nuvexa</div>
<div class="tabs"><button type="button" data-a="tab" data-i="login" class="${r?'':'on'}">Giriş Yap</button><button type="button" data-a="tab" data-i="register" class="${r?'on':''}">Hesap Oluştur</button></div>
${r?inp('name','TAKMA AD','','text','maxlength=24'):''}${inp('username','KULLANICI ADI','','text','required autocapitalize=off')}${inp('pass','ŞİFRE','','password','required minlength=6')}
<div class="err">${esc(S.err)}</div><button class="btn">${r?'Hesabı Oluştur':'Giriş Yap'}</button></form>`}

function sideHTML(){let h='';const u=U(me);
if(S.view!=='server'){
  h=`<div class="sh">Direkt Mesajlar</div><div class="list"><div class="cat">KULLANICILAR</div>`+Object.values(P).filter(x=>x.id!==me).map(x=>`<button class="it ${S.dm===x.id?'on':''}" data-a="dm" data-i="${x.id}">${av(x,30)}<span>${esc(x.name)}</span></button>`).join('')+(Object.keys(P).length<2?'<div class="empty" style="font-size:13px">Henüz başka kullanıcı yok.</div>':'')+`</div>`;
}else{
  const s=srv(),own=s.owner===me,ln=(c,ic)=>`<div class="r2"><button class="it ${S.cid===c.id?'on':''}" data-a="ch" data-i="${c.id}">${ic} ${esc(c.name)}</button>${own?`<button class="x" data-a="delCh" data-i="${c.id}">✕</button>`:''}</div>`;
  const cs=CH.filter(c=>c.server_id===s.id);
  h=`<button class="sh" data-a="srvMenu"><span>${esc(s.name)}</span><span>⌄</span></button><div class="list"><div class="cat">METİN KANALLARI ${own?'<button data-a="addCh" data-i="text">+</button>':''}</div>`+cs.filter(c=>c.type==='text').map(c=>ln(c,'#')).join('')+`<div class="cat">SES KANALLARI ${own?'<button data-a="addCh" data-i="voice">+</button>':''}</div>`+cs.filter(c=>c.type==='voice').map(c=>ln(c,'🔊')).join('')+`</div>`;
}
return`<div class="side">${h}<div class="me"><button style="display:flex;gap:8px;align-items:center;flex:1;min-width:0;text-align:left" data-a="settings">${av(u,34)}<div class="n"><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></button><button class="ib" data-a="settings">⚙</button></div></div>`}

function msgsHTML(){return MS.map(m=>{const u=U(m.user_id),s=S.view==='server'?srv():null,nm=s?nick(s.id,m.user_id):u.name;
return`<div class="m">${av(u,40)}<div><b>${esc(nm)}</b><small>${time(m.created_at)}</small><p>${esc(m.body)}</p></div></div>`}).join('')}

function mainHTML(){
const hb='<button class="hb" data-a="nav">☰</button>';
if(S.view==='disc'){const q=S.q.toLowerCase(),L=SV.filter(s=>!q||s.name.toLowerCase().includes(q)).map(s=>({s,n:MB.filter(m=>m.server_id===s.id).length})).sort((a,b)=>b.n-a.n);
return`<div class="main"><div class="mh">${hb}🧭 Keşfet</div><div class="list" style="padding:18px"><h2 style="font-size:24px">Sunucuları keşfet</h2><small style="color:var(--mu)">Herkesin açtığı tüm sunucular · ${L.length} sunucu</small><input id="dq" placeholder="Sunucu ara…" value="${esc(S.q)}" style="margin:14px 0"><div class="grid">`+L.map(({s,n})=>{const j=isMem(s.id);return`<div class="card"><div style="display:flex;gap:10px;align-items:center"><div class="sv">${esc(s.icon||s.name[0].toUpperCase())}</div><div><b>${esc(s.name)}</b><br><small style="color:var(--mu)">👑 ${esc(U(s.owner).name)} · 👥 ${n}</small></div></div><button class="btn ${j?'g':''}" data-a="${j?'srv':'jsrv'}" data-i="${s.id}">${j?'Sunucuyu Aç':'Katıl'}</button></div>`}).join('')+`</div>${L.length?'':'<div class="empty">Sunucu bulunamadı.</div>'}</div></div>`}
if(S.view==='home'){
  if(!S.dm)return`<div class="main"><div class="mh">${hb}</div><div class="empty"><div class="logo" style="font-size:44px">Nuvexa</div><h2>Hoş geldin, ${esc(U(me).name)}!</h2><p>Soldan biriyle yazış, 🧭 ile sunucu keşfet ya da + ile kendi sunucunu aç.</p></div></div>`;
  const u=U(S.dm);return`<div class="main"><div class="mh">${hb}${av(u,28)} ${esc(u.name)} <small style="color:var(--mu);font-weight:400">@${esc(u.username)}</small></div><div id="msgs">${msgsHTML()||`<div class="empty"><h2>${esc(u.name)}</h2>ile sohbetin başlangıcı.</div>`}</div><form class="in" data-f="send"><input name="x" autocomplete=off placeholder="${esc(u.name)} kişisine mesaj gönder"><button class="btn">Gönder</button></form></div>`}
const c=chan();
if(!c)return`<div class="main"><div class="mh">${hb}</div><div class="empty">Kanal yok.</div></div>`;
if(c.type==='voice')return`<div class="main"><div class="mh">${hb}🔊 ${esc(c.name)}</div><div class="empty"><h2>Sesli sohbet yakında</h2>Gerçek sesli konuşma için WebRTC altyapısı (ör. LiveKit) eklenmesi gerekiyor.</div></div>`;
return`<div class="main"><div class="mh">${hb}# ${esc(c.name)}</div><div id="msgs">${msgsHTML()||`<div class="empty"><h2>#${esc(c.name)} kanalına hoş geldin</h2>İlk mesajı sen yaz.</div>`}</div><form class="in" data-f="send"><input name="x" autocomplete=off placeholder="#${esc(c.name)} kanalına mesaj gönder"><button class="btn">Gönder</button></form></div>`}

function memHTML(){if(S.view!=='server')return'';const s=srv(),L=MB.filter(m=>m.server_id===s.id);
return`<div class="mem"><div class="cat">ÜYELER — ${L.length}</div>`+L.map(m=>`<div class="it" style="color:var(--tx);cursor:default">${av(U(m.user_id),28)}<span>${esc(nick(s.id,m.user_id))}${s.owner===m.user_id?' 👑':''}</span></div>`).join('')+`</div>`}

function render(){const r=$('#app'),old=$('.in input')?.value||'',oldF=document.activeElement?.name==='x';
if(!me){r.innerHTML=authHTML();return}
if(!P[me]){r.innerHTML='<div class="empty">Yükleniyor…</div>';return}
if(S.view==='server'&&(!srv()||!isMem(S.sid))){S.view='home';S.sid=null}
r.className=S.nav?'nav':'';
r.innerHTML=`<div class="rail"><button class="sv ${S.view==='home'?'on':''}" data-a="home" style="background:linear-gradient(135deg,var(--ac),var(--ac2))">N</button><button class="sv ${S.view==='disc'?'on':''}" data-a="disc">🧭</button>`+mySv().map(s=>`<button class="sv ${S.sid===s.id&&S.view==='server'?'on':''}" data-a="srv" data-i="${s.id}" title="${esc(s.name)}">${esc(s.icon||s.name[0].toUpperCase())}</button>`).join('')+`<button class="sv add" data-a="addSrv">+</button></div>${sideHTML()}${mainHTML()}${memHTML()}`+(S.modal?`<div class="ov" data-a="close"><form class="md" data-f="modal"><h3>${esc(S.modal.t)}</h3>${S.modal.b}<div class="row"><button type="button" class="btn g" data-a="close">${S.modal.ok?'İptal':'Kapat'}</button>${S.modal.ok?`<button class="btn">${S.modal.ok}</button>`:''}</div></form></div>`:'');
const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;
const f=$('.in input');if(f){f.value=old;if((oldF||!old)&&!S.modal&&innerWidth>700)f.focus()}}

const modal=(t,b,ok,fn)=>{S.modal={t,b,ok,fn};render()};
const close=()=>{S.modal=null;render()};
const go=async()=>{S.nav=false;await loadMsgs();render()};

/* ---------- İşlemler ---------- */
const A={
tab(i){S.tab=i;S.err='';render()},
close,
nav(){S.nav=!S.nav;render()},
home(){S.view='home';S.sid=null;go()},
disc(){S.view='disc';S.sid=null;S.q='';S.nav=false;render()},
dm(i){S.view='home';S.dm=i;go()},
srv(i){S.view='server';S.sid=i;S.cid=(CH.find(c=>c.server_id===i&&c.type==='text')||CH.find(c=>c.server_id===i))?.id;go()},
ch(i){S.cid=i;go()},
async jsrv(i){const {error}=await sb.from('members').insert({server_id:i,user_id:me});if(error)return alert(error.message);await load();A.srv(i)},
addSrv(){modal('Sunucu Oluştur',inp('name','SUNUCU ADI',U(me).name+' sunucusu','text','required maxlength=30')+inp('icon','SİMGE (emoji, isteğe bağlı)','','text','maxlength=2'),'Oluştur',async d=>{
  const {data:s,error}=await sb.from('servers').insert({name:d.get('name'),icon:d.get('icon'),owner:me}).select().single();if(error)return alert(error.message);
  await sb.from('members').insert({server_id:s.id,user_id:me});
  await sb.from('channels').insert([{server_id:s.id,name:'genel',type:'text'},{server_id:s.id,name:'Sohbet Odası',type:'voice'}]);
  S.modal=null;await load();A.srv(s.id)})},
addCh(t){modal(t==='text'?'Metin Kanalı Oluştur':'Ses Kanalı Oluştur',inp('name','KANAL ADI','','text','required maxlength=24'),'Oluştur',async d=>{
  const {data:c,error}=await sb.from('channels').insert({server_id:S.sid,name:d.get('name').trim(),type:t}).select().single();if(error)return alert(error.message);
  S.cid=c.id;S.modal=null;await load();render()})},
async delCh(i){const c=CH.find(x=>x.id===i);if(CH.filter(x=>x.server_id===S.sid).length<2)return alert('Son kanal silinemez.');if(!confirm(c.name+' kanalı ve mesajları silinsin mi?'))return;
  await sb.from('channels').delete().eq('id',i);if(S.cid===i)S.cid=CH.find(x=>x.server_id===S.sid&&x.id!==i)?.id;await load();render()},
srvMenu(){const s=srv(),o=s.owner===me;modal(s.name,`<button type="button" class="it" data-a="myNick">🪪 Sunucudaki takma adım</button>`+(o?`<button type="button" class="it" data-a="renSrv">✏️ Sunucuyu düzenle</button>`:'')+`<button type="button" class="it" data-a="delSrv" style="color:var(--rd)">${o?'🗑 Sunucuyu sil':'🚪 Sunucudan ayrıl'}</button>`)},
myNick(){modal('Sunucu Profilim',inp('nick','SUNUCUDA TAKMA AD',nick(S.sid,me)===U(me).name?'':nick(S.sid,me),'text','maxlength=24 placeholder="Boş = genel adın"'),'Kaydet',async d=>{
  await sb.from('members').update({nick:d.get('nick').trim()}).eq('server_id',S.sid).eq('user_id',me);S.modal=null;await load();render()})},
renSrv(){const s=srv();modal('Sunucuyu Düzenle',inp('name','SUNUCU ADI',s.name,'text','required')+inp('icon','SİMGE',s.icon||'','text','maxlength=2'),'Kaydet',async d=>{
  await sb.from('servers').update({name:d.get('name'),icon:d.get('icon')}).eq('id',s.id);S.modal=null;await load();render()})},
async delSrv(){const s=srv(),o=s.owner===me;if(!confirm(o?'Sunucu herkes için silinsin mi?':'Sunucudan ayrılınsın mı?'))return;
  if(o)await sb.from('servers').delete().eq('id',s.id);else await sb.from('members').delete().eq('server_id',s.id).eq('user_id',me);
  S.modal=null;S.view='home';S.sid=null;await load();render()},
settings(){const u=U(me);modal('Profilim',`<div>${av(u,64)}</div>`+inp('name','TAKMA AD',u.name,'text','required maxlength=24')+inp('emoji','AVATAR EMOJİSİ',u.emoji||'','text','maxlength=2')+inp('color','AVATAR RENGİ',u.color||'#7c5cff','color')+inp('bio','HAKKINDA',u.bio||'','text','maxlength=100')+`<button type="button" class="btn r" data-a="logout">Hesaptan Çık</button>`,'Kaydet',async d=>{
  await sb.from('profiles').update({name:d.get('name').trim(),emoji:d.get('emoji'),color:d.get('color'),bio:d.get('bio')}).eq('id',me);S.modal=null;await load();render()})},
async logout(){await sb.auth.signOut();me=null;S={view:'home',sid:null,cid:null,dm:null,modal:null,tab:'login',err:'',q:'',nav:false};render()}
};

/* ---------- Olaylar ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;if(t.classList.contains('ov')&&e.target!==t)return;A[t.dataset.a]?.(t.dataset.i)});
document.addEventListener('input',e=>{if(e.target.id!=='dq')return;S.q=e.target.value;render();const d=$('#dq');d.focus();d.setSelectionRange(d.value.length,d.value.length)});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.dataset.f,d=new FormData(e.target);
if(f==='auth'){
  const un=d.get('username').trim().toLowerCase(),pass=d.get('pass'),email=un+'@nuvexa.app';
  if(S.tab==='register'){
    if(!/^[a-z0-9_.]{3,20}$/.test(un))return S.err='Kullanıcı adı 3-20 karakter: harf, rakam, _ .',render();
    const {data,error}=await sb.auth.signUp({email,password:pass});
    if(error)return S.err=error.message.includes('already')?'Bu kullanıcı adı alınmış.':error.message,render();
    if(!data.session)return S.err='Kayıt oldu ama oturum açılmadı: Supabase > Auth > Providers > Email > "Confirm email" seçeneğini kapat.',render();
    const {error:e2}=await sb.from('profiles').insert({id:data.user.id,username:un,name:(d.get('name')||'').trim()||un,color:COLS[Math.floor(Math.random()*COLS.length)]});
    if(e2)return S.err=e2.message,render();
    me=data.user.id;
  }else{
    const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)return S.err='Kullanıcı adı veya şifre hatalı.',render();
    me=data.user.id;
  }
  S.err='';await load();subscribe();render();
}
else if(f==='modal')S.modal?.fn?.(d);
else if(f==='send'){const x=(d.get('x')||'').trim();if(!x)return;e.target.x.value='';
  const row={user_id:me,body:x};if(S.view==='home')row.dm_key=dk(me,S.dm);else row.channel_id=S.cid;
  const {error}=await sb.from('messages').insert(row);if(error)alert(error.message);await loadMsgs();render()}});

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session){me=data.session.user.id;await load();if(!P[me]){await sb.auth.signOut();me=null}else subscribe()}
  render();
})();
</script></body></html>
