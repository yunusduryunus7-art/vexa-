let room=null,VP=[],spk=new Set(),vcid=null,vmute=false,vdeaf=false,wasM=false,vErr='';
const inVoice=()=>S.view==='server'&&S.cid===vcid;
function vUpd(){if(!room)return;VP=[room.localParticipant,...room.remoteParticipants.values()];if(inVoice())render()}
function vClean(){document.querySelectorAll('audio[data-pid]').forEach(e=>e.remove());room=null;VP=[];spk=new Set();vcid=null;vmute=false;vdeaf=false}
function vApply(){if(room)room.localParticipant.setMicrophoneEnabled(!vmute).catch(()=>{});document.querySelectorAll('audio[data-pid]').forEach(a=>a.muted=vdeaf);render()}
async function vJoin(){
  if(room)await vLeave();vErr='';
  try{
    const {data,error}=await sb.functions.invoke('lk-token',{body:{channel_id:S.cid}});
    if(error||!data?.token)throw new Error(error?.message||'Token alınamadı (lk-token fonksiyonu kurulu mu?)');
    const L=LivekitClient,r=new L.Room({adaptiveStream:true});room=r;
    r.on(L.RoomEvent.TrackSubscribed,(t,pub,p)=>{if(t.kind==='audio'){const el=t.attach();el.dataset.pid=p.identity;el.muted=vdeaf;document.body.appendChild(el)}});
    r.on(L.RoomEvent.TrackUnsubscribed,t=>t.detach().forEach(e=>e.remove()));
    [L.RoomEvent.ParticipantConnected,L.RoomEvent.ParticipantDisconnected,L.RoomEvent.TrackMuted,L.RoomEvent.TrackUnmuted].forEach(ev=>r.on(ev,vUpd));
    r.on(L.RoomEvent.ActiveSpeakersChanged,s=>{spk=new Set(s.map(x=>x.identity));vUpd()});
    r.on(L.RoomEvent.Disconnected,()=>{vClean();render()});
    await r.connect(LK_URL,data.token);vcid=S.cid;
    try{await r.startAudio()}catch(e){}
    try{await r.localParticipant.setMicrophoneEnabled(true)}catch(e){vmute=true;vErr='Mikrofon izni verilmedi, sadece dinleyerek bağlandın.'}
    vUpd();render();
  }catch(e){vErr='Bağlanılamadı: '+(e.message||e);if(room){try{room.disconnect()}catch(_){}}vClean();render()}
}
async function vLeave(){if(room)await room.disconnect();vClean();render()}

async function gLoad(){const box=$('#gres');if(!box)return;gTabs();const q=(S.gq||'').trim(),tab=GCATS[S.gt||0],my=++gseq;
  if(!q&&tab[1]==='emoji'){GR=[];box.innerHTML=ANIM.map((a,i)=>`<button type="button" data-a="sg" data-i="a:${i}" style="padding:0">${gifHTML('a:'+i)}</button>`).join('');return}

const toast=t=>{let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--p3);padding:10px 16px;border-radius:12px;z-index:60';document.body.appendChild(e)}e.textContent=t;e.style.display=t?'block':'none'};
const rzm=(f,m)=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(r,'image/jpeg',.85)};im.onerror=()=>r(null);im.src=fr.result};fr.readAsDataURL(f)});
(()=>{const f=document.createElement('input');f.type='file';f.id='attf';f.accept='image/*,video/*';f.hidden=true;document.body.appendChild(f);
f.addEventListener('change',async()=>{const x=f.files[0];f.value='';if(!x)return;const vid=x.type.startsWith('video/'),gif=x.type==='image/gif';
  if(!vid&&!x.type.startsWith('image/'))return alert('Sadece fotoğraf veya video seçebilirsin.');
  if(vid&&x.size>25*1024*1024)return alert('Video en fazla 25 MB olabilir.');if(gif&&x.size>8*1024*1024)return alert('GIF en fazla 8 MB olabilir.');
  toast('Yükleniyor…');let b=x,ct=x.type,ext=(x.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);
  if(!vid&&!gif){b=await rzm(x,1600);if(!b){toast('');return alert('Fotoğraf okunamadı.')}ct='image/jpeg';ext='jpg'}
  const p=me+'/'+Date.now()+'.'+ext,{error}=await sb.storage.from('media').upload(p,b,{contentType:ct});toast('');if(error)return alert(error.message);
  A.sg((vid?'v:':'i:')+sb.storage.from('media').getPublicUrl(p).data.publicUrl)})})();

/* ===== DM sırası + bildirim, çevrimiçi durumu (Presence) ===== */
let DMROWS=[],DC={},DMT={},PCH=null,PS={},lastAct=Date.now(),idleNow=false;

  DMT={};DMROWS.forEach(r=>{const p=pt(r);if(p&&!DMT[p])DMT[p]=r.created_at});
  if(!rd.__d){DMROWS.forEach(r=>{const p=pt(r);if(p&&(!rd['d'+p]||r.created_at>rd['d'+p]))rd['d'+p]=r.created_at});rd.__d=1;setRD(rd)}
  if(S.view==='home'&&S.dm&&!S.fr&&MS.length){const l=MS[MS.length-1].created_at;if(!rd['d'+S.dm]||l>rd['d'+S.dm]){rd['d'+S.dm]=l;setRD(rd)}}
  DC={};DMROWS.forEach(r=>{if(r.user_id===me)return;const p=r.user_id;if(!rd['d'+p]||r.created_at>rd['d'+p])DC[p]=(DC[p]||0)+1})}

const stLbl=s=>STL[s]||STL.off;
const myst=()=>{try{return localStorage.getItem('nvx_st_'+me)||'online'}catch(e){return'online'}};
const eff=()=>{const s=myst();return s==='online'&&idleNow?'idle':s};
const stOf=id=>id===me?(myst()==='invisible'?'off':eff()):(PS[id]||'off');
const myLbl=()=>myst()==='invisible'?STL.invisible:stLbl(eff());
const avp=(u,z)=>{const d=Math.max(9,Math.round(z*.3));return`<span class="avw">${av(u,z)}<i class="dot ${stOf(u.id)}" data-pu="${u.id||''}" style="width:${d}px;height:${d}px"></i></span>`};
function paintP(){document.querySelectorAll('[data-pu]').forEach(el=>{el.className='dot '+stOf(el.dataset.pu)});const m=$('.mem');if(m&&S.view==='server'&&!S.modal){const t=document.createElement('div');t.innerHTML=memHTML();if(t.firstChild)m.replaceWith(t.firstChild)}}
async function pTrack(){if(!PCH)return;const s=eff();try{if(s==='invisible')await PCH.untrack();else await PCH.track({status:s})}catch(e){}paintP()}
function pStart(){if(PCH||!me)return;PCH=sb.channel('nvx_presence',{config:{presence:{key:me}}});
  PCH.on('presence',{event:'sync'},()=>{const st=PCH.presenceState();PS={};for(const k in st){const e=st[k][0];if(e)PS[k]=e.status||'online'}paintP()}).subscribe(s=>{if(s==='SUBSCRIBED')pTrack()})}
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>addEventListener(ev,()=>{lastAct=Date.now();if(idleNow){idleNow=false;pTrack();render()}},{passive:true,capture:true}));

tos:{t:'Hizmet Şartları',s:[
['1. Kabul','Nuvexa’yı kullanarak bu Hizmet Şartları’nı kabul etmiş olursun. Kabul etmiyorsan hesabını kullanma ve uygulamadan çık.'],
['2. Beta sürümü','Nuvexa şu anda beta aşamasındadır. Özellikler değişebilir, hizmette kesinti, hata ya da veri kaybı yaşanabilir. Hizmetin kesintisiz ve hatasız çalışacağını garanti edemeyiz. Önemli bilgilerini tek başına burada saklama.'],
['3. Hesabın','• Nuvexa’yı kullanmak için en az 13 yaşında olmalısın. 18 yaşından küçükysen ebeveynin ya da vasinin bilgisi dahilinde kullanmalısın.\n• Hesabındaki her işlemden sen sorumlusun; şifreni kimseyle paylaşma.\n• Şifre sıfırlama otomatik değildir. Şifreni unutursan yönetime başvurman gerekir.\n• Kullanıcı adın başkasını taklit etmemeli ve kurallara aykırı olmamalıdır.'],
['4. Yasak davranışlar','Şunları yapman yasaktır:\n• Taciz, zorbalık, tehdit, nefret söylemi ve ayrımcılık.\n• Çocukları istismar eden ya da cinselleştiren her türlü içerik. Bu tür içerikler kalıcı banla sonuçlanır ve yetkili makamlara bildirilebilir.\n• Yasa dışı içerik paylaşmak ya da yasa dışı faaliyeti teşvik etmek.\n• Spam, dolandırıcılık, oltalama ve zararlı yazılım paylaşmak.\n• Başkalarının kişisel bilgilerini izinsiz paylaşmak.\n• Rızası olmayan müstehcen içerik paylaşmak.\n• Başkasının telif hakkını ihlal etmek.\n• Uygulamayı bozmaya çalışmak: güvenlik açığı istismarı, otomatik hesap açma, başkalarının hesabına erişmeye çalışma.'],
['5. Paylaştığın içerik','Yazdığın mesajlar, yüklediğin fotoğraf ve videolar sana aittir. Nuvexa’nın çalışabilmesi için bu içerikleri saklamamıza ve ilgili kullanıcılara göstermemize izin vermiş olursun. Paylaştığın içeriklerden sen sorumlusun; hakkın olmayan içerikleri paylaşma.'],
['6. Moderasyon','• Yöneticiler raporları inceleyebilir, kurallara aykırı içerikleri kaldırabilir ve hesapları süreli ya da süresiz banlayabilir. Banlanan kişiye sebep ve süre gösterilir.\n• Sunucu sahipleri kendi sunucularında kanalları, kategorileri ve rolleri yönetebilir, üyelerin bir kanalda mesaj yazmasını sınırlayabilir.\n• Bir karara itirazın varsa yönetimle iletişime geçebilirsin.'],
['7. Raporlama','Kurallara aykırı kullanıcıları ve mesajları raporlayabilirsin. Kötü niyetli ya da asılsız rapor göndermek de kural ihlalidir.'],
['8. Üçüncü taraf hizmetler','Nuvexa; kimlik doğrulama, veri ve dosya depolama için Supabase’i, GIF araması için GIPHY’yi kullanır. Bu hizmetlerin kendi şartları ve gizlilik politikaları geçerlidir.'],
['9. Hesabın sonlanması','Dilediğin zaman kullanmayı bırakabilirsin. Hesabının silinmesini istersen yönetime başvurabilirsin. Bu şartları ihlal edersen hesabın uyarı yapılmadan banlanabilir ya da kapatılabilir.'],
['10. Sorumluluk sınırı','Hizmet “olduğu gibi” sunulur. Yasaların izin verdiği ölçüde; kesintilerden, veri kaybından ve diğer kullanıcıların paylaştığı içeriklerden doğan zararlardan sorumluluk kabul edilmez.'],
['11. Değişiklikler','Bu şartlar zaman zaman güncellenebilir. Önemli bir değişiklik olursa uygulamayı kullanmaya devam etmeden önce yeniden onayını isteyebiliriz.'],
['12. İletişim','{{iletisim}}']]},
priv:{t:'Gizlilik Politikası',s:[
['1. Kısaca','Reklam göstermiyoruz, verini satmıyoruz ve senden e-posta adresi ya da telefon numarası istemiyoruz. Aşağıda hangi verilerin nasıl kullanıldığı anlatılıyor.'],
['2. Hangi verileri topluyoruz','• Hesap: kullanıcı adın, takma adın ve şifren. Şifren şifrelenmiş (özetlenmiş) biçimde saklanır, biz göremeyiz. Giriş için kullanıcı adından teknik bir adres üretilir (örneğin kullaniciadi@nuvexa.app); bu gerçek bir e-posta adresi değildir.\n• Profil: profil fotoğrafın, banner, “hakkında” yazın, avatar emojin ve rengin, rozetlerin.\n• İçerik: sunucu ve özel mesajların (DM), yüklediğin fotoğraf, video ve GIF’ler, oluşturduğun sunucu, kanal, kategori ve roller, arkadaşlıkların, sunucu üyeliklerin ve takma adların.\n• Çevrimiçi durumu: çevrimiçi, boşta ya da rahatsız etme durumun, sen uygulamadayken diğer kullanıcılarla geçici olarak paylaşılır; kalıcı olarak kaydedilmez.\n• Moderasyon: gönderilen raporlar (raporlayan, raporlanan, sebep ve mesaj metni), banlar, kabul ettiğin şartların sürümü ve zamanı.\n• Cihazında: tarayıcı deposunda oturum bilgin, okundu bilgisi, DM listen ve durum tercihin tutulur. Reklam ya da takip çerezi kullanmıyoruz.\n• Teknik kayıtlar: IP adresin ve tarayıcı bilgin, altyapı sağlayıcılarının kayıtlarında geçici olarak görünebilir.'],
['3. Verileri neden kullanıyoruz','Hesabını ve hizmeti çalıştırmak, mesajları iletmek, güvenliği sağlamak, kötüye kullanımı önlemek, raporları incelemek, hataları düzeltmek ve hizmeti geliştirmek için.'],
['4. Kimler görebilir','• Kullanıcı adın, takma adın, profil fotoğrafın, bannerın, “hakkında” yazın, rozetlerin, çevrimiçi durumun ve üye olduğun sunucular diğer kullanıcılara görünür.\n• Sunucu mesajları o sunucunun üyelerine görünür.\n• DM’ler yalnızca konuşmanın iki tarafına görünür.\n• Yüklenen dosyalar herkese açık bağlantıyla saklanır; bağlantıyı bilen herkes açabilir.\n• Yöneticiler, raporlanan içerikleri görebilir.\n• Uygulamayı işleten kişilerin veritabanına teknik erişimi vardır ve DM’ler dahil verilere teknik olarak ulaşabilir. Bu erişim yalnızca teknik bakım, güvenlik ve şikayet incelemesi için kullanılır.'],
['5. Üçüncü taraflar','• Supabase: kimlik doğrulama, veritabanı, dosya depolama ve anlık iletişim altyapısı.\n• GIPHY: GIF ararken arama kelimen ve IP adresin GIPHY’ye gönderilir.\n• jsDelivr: uygulamanın kod kütüphaneleri buradan yüklenir; bu sırada IP adresin görünür.\n• Barındırma sağlayıcısı: sitenin yayınlandığı altyapı.\n• Sesli sohbet etkinleştirilirse ses altyapısı için LiveKit kullanılabilir.\nVerilerini reklam amacıyla kimseyle paylaşmıyoruz ve satmıyoruz.'],

  modal(j?'Sunucuya git':'Sunucuya katıl',`<div style="display:flex;gap:12px;align-items:center"><div class="sv" ${s.img?`style="background:url(${esc(s.img)}) center/cover"`:''}>${s.img?'':esc(s.icon||s.name[0].toUpperCase())}</div><div><b style="font-size:18px">${esc(s.name)}</b><br><small style="color:var(--mu)">👥 ${n} üye · 👑 ${esc(U(s.owner).name)}</small></div></div><p style="color:var(--mu);line-height:1.5">${j?'Zaten bu sunucunun üyesisin.':`<b style="color:var(--tx)">${esc(s.name)}</b> sunucusuna katılmak istiyor musun?`}</p>`,j?'Sunucuyu aç':'Katıl',async()=>{S.modal=null;if(j)A.srv(id);else await A.jsrv(id)})};
A.copyLink=async()=>{const s=srv();if(!s)return;const url=location.origin+location.pathname+'?s='+s.id;
  try{await navigator.clipboard.writeText(url)}catch(e){const t=document.createElement('textarea');t.value=url;t.style.cssText='position:fixed;opacity:0;left:0;top:0';document.body.appendChild(t);t.focus();t.select();try{document.execCommand('copy')}catch(_){}t.remove()}
  S.modal=null;render();toast('Sunucu bağlantısı kopyalandı');setTimeout(()=>toast(''),1800)};

/* Keşfet: sadece gereksinimleri karşılayanlar, aktiviteye göre sıralı */
A.disc=async()=>{S.view='disc';S.sid=null;S.q='';S.nav=false;S.fr=false;DISC=null;render();const r=await sb.rpc('discover_servers');DISC=r.data||[];if(S.view==='disc')render()};
function discHTML(){const hb='<button class="hb" data-a="nav">☰</button>',q=(S.q||'').toLowerCase(),L=(DISC||[]).map(d=>({d,s:SV.find(x=>x.id===d.sid)})).filter(x=>x.s&&(!q||x.s.name.toLowerCase().includes(q)));
  return`<div class="main"><div class="mh">${hb}${IC.compass} Keşfet</div><div class="list" style="padding:18px"><h2 style="font-size:24px">Sunucuları keşfet</h2><small style="color:var(--mu)">En aktif sunucular önce · ${DISC?L.length:0} sunucu</small><input id="dq" placeholder="Sunucu ara…" value="${esc(S.q||'')}" style="margin:14px 0"><div class="grid">`+L.map(({d,s},i)=>{const j=isMem(s.id);
    return`<div class="card" style="padding:0;overflow:hidden"><div style="height:64px;position:relative;background:${s.banner?`url(${esc(s.banner)}) center/cover`:'linear-gradient(135deg,#27272a,#18181a)'}"><span class="rk">#${i+1}</span></div><div style="padding:0 14px 14px;display:flex;flex-direction:column;gap:6px"><div class="sv" style="margin-top:-24px;border:3px solid var(--p2);${s.img?`background:url(${esc(s.img)}) center/cover`:''}">${s.img?'':esc(s.icon||s.name[0].toUpperCase())}</div><b>${esc(s.name)}</b><small style="color:var(--mu)">👑 ${esc(U(s.owner).name)}</small><div class="pmeta"><span>👥 ${d.mem}</span><span>·</span><span>💬 ${d.msgs7} / 7 gün</span><span>·</span><span>🔥 ${d.score}</span></div><button class="btn ${j?'g':''}" style="margin-top:4px" data-a="${j?'srv':'jsrv'}" data-i="${s.id}">${j?'Sunucuyu aç':'Katıl'}</button></div></div>`}).join('')+`</div>`+(!DISC?'<div class="empty">Yükleniyor…</div>':!L.length?'<div class="empty"><h2>Henüz sunucu yok</h2>Keşfet’te görünmek için bir sunucunun <b>5 üyesi</b>, <b>son 7 günde 50 mesajı</b> ve bir <b>sunucu fotoğrafı</b> olması gerekiyor.</div>':'')+`</div></div>`}
A.discReq=async()=>{const s=srv();if(!s||s.owner!==me)return;modal('🧭 Keşfet gereksinimleri','<div class="empty" style="padding:20px">Yükleniyor…</div>',null);
  const {data,error}=await sb.rpc('server_stats',{sid:s.id,days:7});
  if(error||!data){modal('🧭 Keşfet gereksinimleri','<div class="err">'+esc(error?error.message:'Veri alınamadı')+'</div><small style="color:var(--mu)">SQL kurulumunu yaptığından emin ol.</small>',null);return}
  const mem=data.members,m7=(data.daily||[]).reduce((a,x)=>a+x.m,0),pf=!!s.img,ok=mem>=5&&m7>=50&&pf;
  const row=(g,t,cur,need,hint)=>`<div class="reqrow"><span class="rq ${g?'ok':'no'}">${g?'✓':'✕'}</span><div style="flex:1;min-width:0"><b>${t}</b><div class="bar"><i style="width:${Math.min(100,Math.round(cur/need*100))}%"></i></div><small style="color:var(--mu)">${hint}</small></div></div>`;
  modal('🧭 Keşfet gereksinimleri','<p style="color:var(--mu);line-height:1.5">Sunucunun Keşfet sayfasında görünmesi için üç şartın da sağlanması gerekir. Listede <b>aktivite puanı</b> (7 günlük mesaj + 5 × üye sayısı) en yüksek olan sunucular en üstte yer alır.</p>'+row(mem>=5,'En az 5 üye',mem,5,`${mem} / 5 üye`)+row(m7>=50,'Son 7 günde en az 50 mesaj',m7,50,`${m7} / 50 mesaj`)+row(pf,'Sunucu profili (fotoğraf)',pf?1:0,1,pf?'Sunucu fotoğrafı var':'Sunucu menüsü → Sunucuyu düzenle → fotoğraf yükle')+`<div class="reqst ${ok?'ok':'no'}">${ok?'🎉 Sunucun Keşfet’te listeleniyor.':'Sunucun henüz Keşfet’te görünmüyor.'}<br><small>Aktivite puanın: <b>${m7+mem*5}</b></small></div>`,null)};

/* Forum kanalı */
let FP=[],FPO=null,DISC=null;
const ago=t=>{const s=(Date.now()-new Date(t))/1000;return s<60?'şimdi':s<3600?Math.floor(s/60)+' dk önce':s<86400?Math.floor(s/3600)+' sa önce':Math.floor(s/86400)+' gün önce'};
async function loadPosts(){const c=chan();if(S.view!=='server'||!c||c.type!=='forum'){FP=[];FPO=null;return}
  if(S.post){const r=await sb.from('forum_posts').select('*').eq('id',S.post);FPO=(r.data||[])[0]||null}
  else{const r=await sb.from('forum_posts').select('*').eq('channel_id',c.id).order('last_at',{ascending:false}).limit(100);FP=r.data||[]}}
const postCard=p=>{const s=srv(),u=U(p.user_id);return`<button class="pcard" data-a="openpost" data-i="${p.id}"><b class="pt">${esc(p.title)}</b>${p.body?`<span class="pbd">${esc(p.body.slice(0,160))}</span>`:''}<span class="pmeta">${av(u,18)}<span>${esc(s?nick(s.id,p.user_id):u.name)}</span><span>·</span><span>💬 ${p.reply_count}</span><span>·</span><span>${ago(p.last_at)}</span></span></button>`};
const postBody=p=>{const s=srv(),u=U(p.user_id),can=p.user_id===me||(s&&s.owner===me);
  return`<div class="pbox"><h3 style="font-size:20px;margin-bottom:8px">${esc(p.title)}</h3><div style="display:flex;gap:8px;align-items:center;color:var(--mu);font-size:13px;margin-bottom:10px"><button data-a="prof" data-i="${p.user_id}" style="display:flex">${av(u,22)}</button><b style="color:var(--tx)">${esc(s?nick(s.id,p.user_id):u.name)}</b><span>${ago(p.created_at)}</span>${can?`<button class="ib" style="margin-left:auto;width:auto;padding:0 10px;font-size:13px" data-a="delpost" data-i="${p.id}">🗑 Sil</button>`:''}</div><div style="white-space:pre-wrap;word-break:break-word;line-height:1.55">${fmt(p.body||'',s?s.id:null)}</div><div class="cat" style="padding:14px 0 0">${p.reply_count} YANIT</div></div>`};
function forumHTML(c){const hb='<button class="hb" data-a="nav">☰</button>';
  if(S.post){const p=FPO;return`<div class="main"><div class="mh">${hb}<button class="ib" data-a="postback" title="Gönderilere dön">←</button><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p?p.title:'Gönderi')}</span></div><div id="msgs">${p?postBody(p)+msgsHTML():'<div class="empty"><h2>Gönderi bulunamadı</h2>Silinmiş olabilir.</div>'}</div>${p?`<form class="in" data-f="send"><button type="button" class="btn g" data-a="attach" title="Fotoğraf / video ekle" style="padding:0 16px;font-size:20px">+</button><input name="x" autocomplete=off placeholder="Yanıt yaz…"><button type="button" class="btn g" data-a="gif0">GIF</button><button class="btn">Gönder</button></form>`:''}</div>`}
  return`<div class="main"><div class="mh">${hb}${IC.forum} ${esc(c.name)}${cantSend(c.id)?'':'<button class="btn" style="margin-left:auto;padding:6px 14px" data-a="newpost">＋ Yeni gönderi</button>'}</div><div class="list" style="padding:16px;display:flex;flex-direction:column;gap:10px">${FP.length?FP.map(postCard).join(''):'<div class="empty"><h2>Henüz gönderi yok</h2>İlk gönderiyi sen aç ve tartışmayı başlat.</div>'}</div></div>`}
A.newpost=()=>{const c=chan();if(!c)return;modal('Yeni gönderi',inp('title','BAŞLIK','','text','required maxlength=100 placeholder="Konu başlığı"')+'<div><label>İÇERİK</label><textarea name="body" rows="6" maxlength="4000" placeholder="Ne düşünüyorsun?"></textarea></div>','Gönder',async d=>{
  const {data,error}=await sb.from('forum_posts').insert({channel_id:c.id,user_id:me,title:d.get('title').trim(),body:(d.get('body')||'').trim()}).select().single();if(error)return alert(error.message);
  S.modal=null;S.post=data.id;await go()})};
A.openpost=async id=>{S.post=id;await go()};
A.postback=async()=>{S.post=null;await go()};
A.delpost=async id=>{if(!confirm('Gönderi ve tüm yanıtları silinsin mi?'))return;const {error}=await sb.from('forum_posts').delete().eq('id',id);if(error)return alert(error.message);S.post=null;await go()};
const _ch2=A.ch,_sv2=A.srv;A.ch=i=>{S.post=null;_ch2(i)};A.srv=i=>{S.post=null;_sv2(i)};
const _mh9=mainHTML;mainHTML=function(){const c=S.view==='server'&&chan();if(S.view==='disc')return discHTML();if(c&&c.type==='forum')return forumHTML(c);return _mh9()};


/* ===== Yazıyor göstergesi, roller (ayar/varsayılan/etiket), kanal rol izinleri ===== */
let TYC=null,TYS='',TYR=false,TY={},typT=0,CRP=[];
const typScope=()=>S.view==='server'&&S.cid?S.cid+(S.post?'.'+S.post:''):(S.view==='home'&&S.dm&&!S.fr?dk(me,S.dm):'');
function typSync(){const sc=typScope();if(sc===TYS)return;if(TYC){try{sb.removeChannel(TYC)}catch(e){}TYC=null}TYS=sc;TYR=false;TY={};if(!sc||!me)return;
  TYC=sb.channel('typ:'+sc,{config:{broadcast:{self:false}}}).on('broadcast',{event:'t'},p=>{TY[p.payload.u]=Date.now();showTyping()}).on('broadcast',{event:'s'},p=>{delete TY[p.payload.u];showTyping()}).subscribe(s=>{TYR=s==='SUBSCRIBED'})}
function typStop(){if(TYC&&TYR){try{TYC.send({type:'broadcast',event:'s',payload:{u:me}})}catch(e){}}typT=0}
document.addEventListener('input',e=>{const t=e.target;if(t.name!=='x')return;if(!t.value){typStop();return}if(!TYC||!TYR)return;const n=Date.now();if(n-typT<2500)return;typT=n;try{TYC.send({type:'broadcast',event:'t',payload:{u:me}})}catch(_){}});
function showTyping(){const now=Date.now();for(const u in TY)if(now-TY[u]>5000)delete TY[u];const ids=Object.keys(TY).filter(u=>u!==me),f=document.querySelector('#app .in');let bar=document.getElementById('typbar');
  if(!ids.length||!f||f.tagName==='DIV'&&!f.querySelector('input')){if(bar)bar.remove();return}
  const s=S.view==='server'?srv():null,nm=ids.map(u=>s?nick(s.id,u):U(u).name),
  txt=nm.length>3?'Birkaç kişi yazıyor…':nm.length===1?nm[0]+' yazıyor…':nm.slice(0,-1).join(', ')+' ve '+nm[nm.length-1]+' yazıyor…';
  if(!bar){bar=document.createElement('div');bar.id='typbar';const a=document.querySelector('#app .repbar')||f;a.parentNode.insertBefore(bar,a)}
  bar.innerHTML='<span class="td"><i></i><i></i><i></i></span><span>'+esc(txt)+'</span>'}
setInterval(showTyping,1000);

/* Rol izinleri */
const PERMS=[['can_send','Mesaj'],['can_files','Dosya'],['can_gifs','GIF'],['can_react','Tepki']];
const can=(cid,perm)=>{const c=CH.find(x=>x.id===cid),s=c&&SV.find(x=>x.id===c.server_id);if(!s||s.owner===me)return true;
  const my=MR.filter(x=>x.server_id===s.id&&x.user_id===me).map(x=>x.role_id),rows=CRP.filter(x=>x.channel_id===cid&&my.includes(x.role_id));return !rows.length||rows.some(x=>x[perm])};
function permUI(a){const f=a.querySelector('.in');if(!f||S.view!=='server'||!S.cid)return;const ps=can(S.cid,'can_send'),pf=can(S.cid,'can_files'),pg=can(S.cid,'can_gifs');
  if(!ps&&!pf&&!pg){f.outerHTML='<div class="in" style="justify-content:center;color:var(--mu);padding:12px 16px 16px">🔒 Bu kanalda mesaj yazma iznin yok.</div>';return}
  const i=f.querySelector('input[name=x]');if(!ps&&i){i.disabled=true;i.placeholder='Bu kanalda mesaj yazma iznin yok'}
  if(!pf){const b=f.querySelector('[data-a="attach"]');if(b)b.remove()}if(!pg){const b=f.querySelector('[data-a="gif0"]');if(b)b.remove()}}
const permRows=c=>CRP.filter(x=>x.channel_id===c.id).map(row=>{const r=RL.find(x=>x.id===row.role_id);if(!r)return'';
  return`<div class="rolerow" style="flex-wrap:wrap"><span style="color:${r.color}">●</span><b style="flex:1;min-width:80px;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</b>${PERMS.map(([k,l])=>`<button type="button" class="pm${row[k]?'':' no'}" data-a="crpt" data-i="${c.id}|${r.id}|${k}">${l}: ${row[k]?'Açık':'Kapalı'}</button>`).join('')}<button type="button" class="ib" style="width:28px;height:28px" data-a="crpdel" data-i="${c.id}|${r.id}">✕</button></div>`}).join('');
const permInner=c=>{const avail=RL.filter(r=>r.server_id===c.server_id&&!CRP.some(x=>x.channel_id===c.id&&x.role_id===r.id));
  return permRows(c)+(avail.length?`<div style="display:flex;gap:8px"><select id="crpsel">${avail.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select><button type="button" class="btn g" style="flex:none" data-a="crpadd" data-i="${c.id}">＋ Rol ekle</button></div>`:(RL.some(r=>r.server_id===c.server_id)?'':'<small style="color:var(--mu)">Önce sunucu menüsünden Roller bölümünde bir rol oluştur.</small>'))};
const crpRefresh=c=>{const w=document.getElementById('crpw'),ch=CH.find(x=>x.id===c);if(w&&ch)w.innerHTML=permInner(ch)};
A.crpadd=async c=>{const sel=document.getElementById('crpsel');if(!sel)return;const rid=sel.value,{error}=await sb.from('channel_role_perms').insert({channel_id:c,role_id:rid});if(error)return alert(error.message);CRP.push({channel_id:c,role_id:rid,can_send:true,can_files:true,can_gifs:true,can_react:true});crpRefresh(c)};
A.crpt=async v=>{const [c,r,k]=v.split('|'),row=CRP.find(x=>x.channel_id===c&&x.role_id===r);if(!row)return;const nv=!row[k],{error}=await sb.from('channel_role_perms').update({[k]:nv}).eq('channel_id',c).eq('role_id',r);if(error)return alert(error.message);row[k]=nv;crpRefresh(c)};
A.crpdel=async v=>{const [c,r]=v.split('|'),{error}=await sb.from('channel_role_perms').delete().eq('channel_id',c).eq('role_id',r);if(error)return alert(error.message);CRP=CRP.filter(x=>!(x.channel_id===c&&x.role_id===r));crpRefresh(c)};
const _at=A.attach;A.attach=()=>{if(S.view==='server'&&!can(S.cid,'can_files'))return alert('Bu kanalda dosya gönderme iznin yok.');_at()};
const _g0=A.gif0;A.gif0=()=>{if(S.view==='server'&&!can(S.cid,'can_gifs'))return alert('Bu kanalda GIF gönderme iznin yok.');_g0()};

/* Roller: ayarlar, renk, varsayılan, etiketlenebilir */
A.roles=()=>{const s=srv();if(!s||s.owner!==me)return;const L=RL.filter(r=>r.server_id===s.id);
  modal('🎭 Roller',(L.length?L.map(r=>`<div class="rolerow"><span style="color:${r.color}">●</span><b style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</b>${r.is_default?'<span class="tg">Varsayılan</span>':''}${r.mentionable?'<span class="tg">@</span>':''}<button type="button" class="btn g" style="padding:4px 12px" data-a="roleSet" data-i="${r.id}">⚙ Ayarlar</button></div>`).join(''):'<small style="color:var(--mu)">Henüz rol yok.</small>')+'<button type="button" class="btn" data-a="addRole">＋ Rol oluştur</button>',null)};
A.roleSet=id=>{const r=RL.find(x=>x.id===id);if(!r)return;
  modal('⚙ '+r.name,inp('name','ROL ADI',r.name,'text','required maxlength=20')+inp('color','RENK',r.color,'color')+`<label class="chk"><input type="checkbox" name="def" ${r.is_default?'checked':''}><span><b>Varsayılan rol</b><br><small style="color:var(--mu)">Sunucuya katılan herkese ve şu an üye olan herkese otomatik verilir.</small></span></label><label class="chk"><input type="checkbox" name="men" ${r.mentionable?'checked':''}><span><b>Etiketlenebilir</b><br><small style="color:var(--mu)">Açıksa mesajda @${esc(r.name)} yazılarak bu roldeki herkes etiketlenebilir.</small></span></label><button type="button" class="btn r" data-a="roleDel" data-i="${id}">Rolü sil</button>`,'Kaydet',async d=>{
    const def=!!d.get('def'),men=!!d.get('men');
    if(def)await sb.from('roles').update({is_default:false}).eq('server_id',r.server_id).neq('id',r.id);
    const {error}=await sb.from('roles').update({name:d.get('name').trim(),color:d.get('color'),is_default:def,mentionable:men}).eq('id',r.id);if(error)return alert(error.message);
    if(def&&!r.is_default){const rows=MB.filter(m=>m.server_id===r.server_id).map(m=>({server_id:r.server_id,user_id:m.user_id,role_id:r.id}));if(rows.length)await sb.from('member_roles').upsert(rows,{onConflict:'user_id,role_id',ignoreDuplicates:true})}
    S.modal=null;await load();A.roles()})};
A.roleDel=async id=>{if(!confirm('Rol silinsin mi? Rolü olan herkesten alınır.'))return;const {error}=await sb.from('roles').delete().eq('id',id);if(error)return alert(error.message);S.modal=null;await load();A.roles()};

(async()=>{
  const app=$('#app'),to=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('zaman aşımı')),ms))]);
  app.innerHTML='<div class="empty">Yükleniyor…</div>';
  try{
    const {data}=await to(sb.auth.getSession(),8000);
    if(data.session){me=data.session.user.id;await to(load(),12000);if(!P[me]){await sb.auth.signOut();me=null}else subscribe()}
    render();
  }catch(e){
    app.innerHTML='<div class="empty"><h2>Sunucuya bağlanılamadı</h2><p>'+esc(e.message||e)+'</p><p style="margin-top:10px">İnternetini ve VPN\'ini kontrol et. Supabase projen duraklatılmış olabilir (Supabase panelinde "Restore project").</p><button class="btn" onclick="location.reload()" style="margin-top:14px">Yeniden dene</button></div>';
  }
})();
