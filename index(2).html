<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvexa</title>
<style>
:root{color-scheme:dark;--bg:#0f1020;--p1:#171830;--p2:#1e2040;--p3:#2a2d55;--tx:#e8e9ff;--mu:#9a9dc9;--ac:#7c5cff;--ac2:#22d3ee;--rd:#ff5d73;--gr:#34d399}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{height:100%;display:flex;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input{background:var(--bg);border:1px solid var(--p3);border-radius:10px;padding:10px 12px;width:100%;outline:0}
input:focus{border-color:var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),#5b8cff);padding:10px 16px;border-radius:10px;font-weight:600}
.btn.g{background:var(--p3)}.btn.r{background:var(--rd)}
.rail{width:72px;background:#0a0b18;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px;overflow-y:auto;flex:none}
.sv{width:48px;height:48px;border-radius:24px;background:var(--p2);display:grid;place-items:center;font-size:20px;font-weight:700;transition:.2s;position:relative;flex:none}
.sv:hover,.sv.on{border-radius:16px;background:var(--ac)}
.sv.on:before{content:"";position:absolute;left:-12px;width:5px;height:28px;background:#fff;border-radius:0 4px 4px 0}
.sv.add{color:var(--gr)}
.side{width:250px;background:var(--p1);display:flex;flex-direction:column;flex:none}
.sh{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;font-weight:700;border-bottom:1px solid #0003;width:100%;text-align:left}
.list{flex:1;overflow-y:auto;padding:8px}
.cat{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.06em;padding:14px 8px 4px}
.cat button{color:var(--mu);font-size:18px;line-height:1}
.it{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--mu);width:100%;text-align:left}
.it:hover{background:var(--p2);color:var(--tx)}.it.on{background:var(--p3);color:#fff}
.vm{padding:2px 10px 2px 34px;color:var(--mu);font-size:13px;display:flex;gap:6px;align-items:center}
.me{background:#12132a;padding:8px;display:flex;align-items:center;gap:8px}
.me .n{flex:1;min-width:0}.me b,.me small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mu);font-size:12px}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}.ib:hover{background:var(--p3)}.ib.off{color:var(--rd)}
.av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;color:#fff}
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--p2)}
.mh{height:52px;padding:0 18px;display:flex;align-items:center;gap:8px;font-weight:700;border-bottom:1px solid #0003;flex:none}
#msgs{flex:1;overflow-y:auto;padding:16px 18px}
.m{display:flex;gap:12px;padding:6px 0}.m b{margin-right:8px}.m small{color:var(--mu);font-size:12px}.m p{white-space:pre-wrap;word-break:break-word}
.in{padding:0 16px 16px}.in input{background:var(--p3);border:0;padding:13px 16px;border-radius:12px}
.mem{width:220px;background:var(--p1);padding:12px;overflow-y:auto;flex:none}
.mem .it{padding:6px 8px}
.empty{margin:auto;text-align:center;color:var(--mu);padding:24px}
.empty h2{color:var(--tx);margin-bottom:6px;font-size:24px}
.vgrid{flex:1;display:flex;flex-wrap:wrap;gap:16px;padding:24px;align-content:flex-start}
.vc{width:180px;height:130px;background:var(--p1);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:2px solid transparent}
.vc.sp{border-color:var(--gr);animation:pl 1.2s infinite}
@keyframes pl{50%{box-shadow:0 0 18px #34d39966}}
.vbar{padding:16px;display:flex;gap:10px;justify-content:center}
.ov{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:9;padding:16px}
.md{background:var(--p1);border-radius:16px;padding:22px;width:min(420px,100%);max-height:90%;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.md h3{font-size:20px}.md label{font-size:12px;color:var(--mu);font-weight:700;display:block;margin-bottom:4px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.auth{margin:auto;width:min(400px,92%);background:var(--p1);padding:28px;border-radius:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px #0008}
.logo{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent;text-align:center;letter-spacing:-.02em}
.tabs{display:flex;background:var(--bg);border-radius:10px;padding:4px}.tabs button{flex:1;padding:8px;border-radius:8px;color:var(--mu)}.tabs .on{background:var(--p3);color:#fff}
.err{color:var(--rd);font-size:13px}
.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.chk input{width:auto}
.in{display:flex;gap:8px}.in input{flex:1}.in .btn{padding:0 16px;border-radius:12px}
.ga{width:150px;height:110px;border-radius:14px;display:grid;place-items:center;font-size:52px;margin-top:4px;position:relative;overflow:hidden}.ga span{display:block;transform-origin:50% 80%}.ga small{position:absolute;bottom:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#fff;opacity:.9}
@keyframes g-bounce{50%{transform:translateY(-16px)}}@keyframes g-pulse{50%{transform:scale(1.3)}}@keyframes g-shake{25%{transform:translateX(-8px) rotate(-8deg)}75%{transform:translateX(8px) rotate(8deg)}}@keyframes g-spin{to{transform:rotate(360deg)}}@keyframes g-wave{50%{transform:rotate(28deg)}}@keyframes g-float{50%{transform:translateY(-10px) scale(.9);opacity:.7}}@keyframes g-flick{50%{transform:scale(1.15) rotate(5deg)}}@keyframes g-pop{50%{transform:scale(1.4)}}@keyframes g-swing{25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
[data-sp].sp .av{box-shadow:0 0 0 3px var(--gr),0 0 14px #34d399aa}.vc.sp .av{box-shadow:0 0 0 5px var(--gr),0 0 22px #34d399cc}.me button[data-a=prof]:hover{background:var(--p3);border-radius:8px}
@media(max-width:900px){.mem{display:none}}
input{font-size:16px}
@supports(height:100dvh){html,body{height:100dvh}}
.hb,.mb{display:none;width:36px;height:36px;border-radius:8px;place-items:center;font-size:18px;flex:none}.mb{margin-left:auto}.hb:hover,.mb:hover{background:var(--p3)}
.bd{display:none;position:fixed;inset:0;background:#0008;z-index:15}
@media(max-width:900px){.bd{display:block}.mb{display:grid}.mem{display:none}#app.mp .mem{display:block;position:fixed;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:240px;z-index:20;box-shadow:-8px 0 30px #0008}}
@media(max-width:700px){.hb{display:grid}.rail,.side{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);z-index:20;transform:translateX(-130%);transition:transform .2s}.rail{left:0;width:64px}.side{left:64px;width:min(250px,calc(100vw - 80px))}#app.nav .rail,#app.nav .side{transform:none;box-shadow:8px 0 30px #0008}.vc{width:calc(50% - 8px)}.in{padding:0 10px 12px}#msgs{padding:12px}.vgrid{padding:14px}.mh{padding:0 10px}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mem={},ls={get(k){try{return localStorage.getItem(k)}catch(e){return mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}};
let db;try{db=JSON.parse(ls.get('nvx_db'))}catch(e){}db=db||{users:{},servers:{},dms:{}};
let me=ls.get('nvx_me');
const save=()=>ls.set('nvx_db',JSON.stringify(db)),uid=()=>Math.random().toString(36).slice(2,9);
async function hash(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('nvx'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(p)))}}
let S={view:'home',sid:null,cid:null,dm:null,modal:null,tab:'login',err:'',vc:{},mute:false,deaf:false};
const U=id=>db.users[id]||{name:'?',color:'#666',emoji:'',username:'?'};
const av=(u,z=38)=>`<div class="av" style="width:${z}px;height:${z}px;background:${u.img?`url(${u.img}) center/cover`:u.color};font-size:${z*.48}px">${u.img?'':esc(u.emoji||u.name[0].toUpperCase())}</div>`;
const srv=()=>db.servers[S.sid],chan=()=>srv()?.channels.find(c=>c.id===S.cid);
const myServers=()=>Object.values(db.servers).filter(s=>s.members[me]);
const nick=(s,u)=>s.members[u]?.nick||U(u).name;
const rcol=(s,u)=>{const r=s.roles.find(r=>(s.members[u]?.roles||[]).includes(r.id));return r?r.color:'#e8e9ff'};
const dk=(a,b)=>[a,b].sort().join('_');
const inp=(k,l,v='',t='text',x='')=>`<div><label>${l}</label><input name="${k}" type="${t}" value="${esc(v)}" ${x}></div>`;
const time=t=>new Date(t).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const COLS=['#7c5cff','#22d3ee','#f472b6','#f59e0b','#34d399','#fb7185','#60a5fa','#a78bfa'];

function authHTML(){const r=S.tab==='register';return`<form class="auth" data-f="auth"><div class="logo">Nuvexa</div>
<div class="tabs"><button type="button" data-a="tab" data-i="login" class="${r?'':'on'}">Giriş Yap</button><button type="button" data-a="tab" data-i="register" class="${r?'on':''}">Hesap Oluştur</button></div>
${r?inp('name','TAKMA AD','', 'text','maxlength=24'):''}${inp('username','KULLANICI ADI','','text','required autocapitalize=off')}${inp('pass','ŞİFRE','','password','required')}
<div class="err">${esc(S.err)}</div><button class="btn">${r?'Hesabı Oluştur':'Giriş Yap'}</button></form>`}

function sideHTML(){let h='';
if(S.view==='home'||S.view==='disc'){h=`<div class="sh">Direkt Mesajlar</div><div class="list"><button class="it ${S.fr?'on':''}" data-a="friends">👥 Arkadaşlar ${pendingCount()?`<b style="background:var(--rd);color:#fff;border-radius:10px;padding:0 7px;font-size:12px">${pendingCount()}</b>`:''}</button><div class="cat">DİREKT MESAJLAR</div>`+dmList().map(u=>`<button class="it ${S.dm===u.id&&!S.fr?'on':''}" data-a="dm" data-i="${u.id}">${av(u,30)}<span>${esc(u.name)}</span></button>`).join('')+(Object.keys(db.users).length<2?'<div class="empty" style="font-size:13px">Başka bir hesap oluşturunca burada görünür. Çıkış yapıp yeni hesap açabilirsin.</div>':'')+`</div>`}
else{const s=srv(),own=s.owner===me,T=s.channels.filter(c=>c.type==='text'),V=s.channels.filter(c=>c.type==='voice');
h=`<button class="sh" data-a="srvMenu"><span>${esc(s.name)}</span><span>⌄</span></button><div class="list">
<div class="cat">METİN KANALLARI ${own?'<button data-a="addCh" data-i="text">+</button>':''}</div>`+T.map(c=>`<button class="it ${S.cid===c.id?'on':''}" data-a="ch" data-i="${c.id}"># ${esc(c.name)}</button>`).join('')+
`<div class="cat">SES KANALLARI ${own?'<button data-a="addCh" data-i="voice">+</button>':''}</div>`+V.map(c=>`<button class="it ${S.cid===c.id?'on':''}" data-a="ch" data-i="${c.id}">🔊 ${esc(c.name)}</button>`+(S.vc[c.id]||[]).map(u=>`<div class="vm ${u===me&&S.sp?'sp':''}" ${u===me?'data-sp':''}>${av(U(u),20)}${esc(nick(s,u))}</div>`).join('')).join('')+`</div>`}
const u=U(me),inv=Object.values(S.vc).some(a=>a.includes(me));
return`<div class="side">${h}${inv?`<div class="me" style="background:#0f2a22;color:var(--gr)"><span class="n"><b>Ses bağlandı</b></span><button class="ib" data-a="leave">📞</button></div>`:''}
<div class="me"><button class="${S.sp?'sp':''}" data-sp style="display:flex;gap:8px;align-items:center;flex:1;min-width:0;text-align:left" data-a="prof" data-i="${me}">${av(u,34)}<div class="n"><b>${esc(u.name)}</b><small>@${esc(u.username)}</small></div></button>
<button class="ib ${S.mute?'off':''}" data-a="mute">${S.mute?'🔇':'🎙'}</button><button class="ib ${S.deaf?'off':''}" data-a="deaf">${S.deaf?'🔕':'🎧'}</button><button class="ib" data-a="settings">⚙</button></div></div>`}

function msgsHTML(arr){return arr.length?arr.map(m=>{const u=U(m.u),s=S.view==='server'?srv():null;return`<div class="m">${av(u,40)}<div><b style="color:${s?rcol(s,m.u):'#fff'}">${esc(s?nick(s,m.u):u.name)}</b><small>${time(m.t)}</small>${m.g?gifHTML(m.g):`<p>${esc(m.x)}</p>`}</div></div>`}).join(''):''}

function mainHTML(){
if(S.view==='disc')return discHTML();if(S.view==='home'){if(S.fr)return friendsHTML();if(!S.dm)return`<div class="main"><div class="empty"><div class="logo" style="font-size:44px">Nuvexa</div><h2>Hoş geldin, ${esc(U(me).name)}!</h2><p>Soldan bir arkadaşını seç, ya da sunucu oluştur.</p></div></div>`;
const u=U(S.dm),a=db.dms[dk(me,S.dm)]||[];return`<div class="main"><div class="mh">${av(u,28)} ${esc(u.name)} <small style="color:var(--mu);font-weight:400">@${esc(u.username)}</small></div><div id="msgs">${msgsHTML(a)||`<div class="empty"><h2>${esc(u.name)}</h2>ile sohbetin başlangıcı.</div>`}</div><form class="in" data-f="send"><input name="x" autocomplete=off placeholder="${esc(u.name)} kişisine mesaj gönder"><button type="button" class="btn g" data-a="gif">GIF</button></form></div>`}
const s=srv(),c=chan();
if(c.type==='voice'){const L=S.vc[c.id]||[],j=L.includes(me);return`<div class="main"><div class="mh">🔊 ${esc(c.name)}</div><div class="vgrid">${L.map(u=>`<div class="vc ${u===me&&S.sp?'sp':''}" ${u===me?'data-sp':''}>${av(U(u),56)}<small>${esc(nick(s,u))} ${u===me&&S.mute?'🔇':''}</small></div>`).join('')||'<div class="empty"><h2>Kimse yok</h2>Katılarak ilk kişi ol.</div>'}</div>${S.micErr&&j?`<div class="err" style="text-align:center;padding:0 16px">${esc(S.micErr)}</div>`:''}<div class="vbar">${j?`<button class="btn g" data-a="mute">${S.mute?'Sesi Aç':'Sustur'}</button><button class="btn g" data-a="deaf">${S.deaf?'Kulaklık Aç':'Sağırlaştır'}</button><button class="btn r" data-a="leave">Ayrıl</button>`:`<button class="btn" data-a="join">Ses Kanalına Katıl</button>`}</div></div>`}
return`<div class="main"><div class="mh"># ${esc(c.name)}</div><div id="msgs">${msgsHTML(c.msgs)||`<div class="empty"><h2>#${esc(c.name)} kanalına hoş geldin</h2>İlk mesajı sen yaz.</div>`}</div><form class="in" data-f="send"><input name="x" autocomplete=off placeholder="#${esc(c.name)} kanalına mesaj gönder"><button type="button" class="btn g" data-a="gif">GIF</button></form></div>`}

function memHTML(){if(S.view!=='server')return'';const s=srv();const roleOf=u=>s.roles.find(r=>(s.members[u].roles||[]).includes(r.id));
return`<div class="mem"><div class="cat">ÜYELER — ${Object.keys(s.members).length}</div>`+Object.keys(s.members).map(u=>{const r=roleOf(u);return`<button class="it" data-a="member" data-i="${u}" style="color:${rcol(s,u)}">${av(U(u),28)}<span>${esc(nick(s,u))}${s.owner===u?' 👑':''}<small style="display:block;color:var(--mu);font-size:11px">${r?esc(r.name):''}</small></span></button>`}).join('')+`</div>`}

function appHTML(){return`<div class="rail"><button class="sv ${S.view==='home'?'on':''}" data-a="home" style="background:linear-gradient(135deg,var(--ac),var(--ac2))">N</button><button class="sv ${S.view==='disc'?'on':''}" data-a="disc" title="Keşfet">🧭</button>`+myServers().map(s=>`<button class="sv ${S.sid===s.id&&S.view==='server'?'on':''}" data-a="srv" data-i="${s.id}" title="${esc(s.name)}" ${s.img?`style="background:url(${s.img}) center/cover"`:''}>${s.img?'':esc(s.icon||s.name[0].toUpperCase())}</button>`).join('')+`<button class="sv add" data-a="addSrv">+</button></div>${sideHTML()}${mainHTML()}${memHTML()}`}

function render(){const r=$('#app');if(!me||!db.users[me]){me=null;r.innerHTML=authHTML();return}
if(S.view==='server'&&(!srv()||!srv().members[me])){S.view='home';S.sid=null}
r.innerHTML=appHTML()+(S.modal?`<div class="ov" data-a="close"><form class="md" data-f="modal"><h3>${esc(S.modal.t)}</h3>${S.modal.b}<div class="row">${S.modal.ok?`<button type="button" class="btn g" data-a="close">İptal</button><button class="btn">${S.modal.ok}</button>`:`<button type="button" class="btn g" data-a="close">Kapat</button>`}</div></form></div>`:'');
const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;const f=$('.in input');if(f&&!S.modal&&innerWidth>700)f.focus()}

function modal(t,b,ok,fn){S.modal={t,b,ok,fn};render()}
const close=()=>{S.modal=null;render()};
function leaveVoice(){for(const k in S.vc)S.vc[k]=S.vc[k].filter(u=>u!==me)}

const A={
tab(i){S.tab=i;S.err='';render()},
home(){S.view='home';S.sid=null;render()},
dm(i){S.dm=i;render()},
srv(i){S.view='server';S.sid=i;S.cid=srv().channels.find(c=>c.type==='text')?.id||srv().channels[0].id;render()},
ch(i){S.cid=i;render()},
close,
mute(){S.mute=!S.mute;render()},deaf(){S.deaf=!S.deaf;if(S.deaf)S.mute=true;render()},
join(){leaveVoice();(S.vc[S.cid]=S.vc[S.cid]||[]).push(me);render()},leave(){leaveVoice();render()},
logout(){leaveVoice();me=null;ls.del('nvx_me');S.modal=null;S.view='home';S.sid=null;S.dm=null;render()},
addSrv(){modal('Sunucu Oluştur',inp('name','SUNUCU ADI',U(me).name+' sunucusu','text','required maxlength=30')+inp('icon','SİMGE (emoji, isteğe bağlı)','','text','maxlength=2'),'Oluştur',d=>{const id=uid();db.servers[id]={id,name:d.get('name'),icon:d.get('icon'),owner:me,members:{[me]:{nick:'',roles:[]}},roles:[],channels:[{id:uid(),name:'genel',type:'text',msgs:[]},{id:uid(),name:'Sohbet Odası',type:'voice',msgs:[]}]};save();close();A.srv(id)})},
addCh(i){modal(i==='text'?'Metin Kanalı Oluştur':'Ses Kanalı Oluştur',inp('name','KANAL ADI','','text','required maxlength=24'),'Oluştur',d=>{const c={id:uid(),name:d.get('name').trim(),type:i,msgs:[]};srv().channels.push(c);save();S.cid=c.id;close()})},
srvMenu(){const s=srv(),o=s.owner===me;modal(s.name,`<button type="button" class="it" data-a="myNick">🪪 Sunucudaki takma adım</button>`+(o?`<button type="button" class="it" data-a="renSrv">✏️ Sunucu adını değiştir</button><button type="button" class="it" data-a="addRole">🎭 Rol oluştur</button><button type="button" class="it" data-a="invite">➕ Üye ekle</button>`:'')+`<button type="button" class="it" data-a="delSrv" style="color:var(--rd)">${o?'🗑 Sunucuyu sil':'🚪 Sunucudan ayrıl'}</button>`)},
myNick(){const m=srv().members[me];modal('Sunucu Profilim',inp('nick','SUNUCUDA TAKMA AD',m.nick,'text','maxlength=24 placeholder="Boş = genel adın"'),'Kaydet',d=>{m.nick=d.get('nick').trim();save();close()})},
